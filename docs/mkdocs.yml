site_name: KFR 7 documentation
site_url: https://docs.kfr.dev
theme:
  logo: img/logo.png
  favicon: img/logo.png
  font:
    text: Inter
    code: Cascadia Mono
  name: "material"
  custom_dir: custom
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - navigation.indexes
    - navigation.prune
    - navigation.path
    - toc.follow
    - navigation.footer
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      primary: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

extra:
  search:
    language: en

  social:
    - icon: fontawesome/brands/github-alt
      link: "https://github.com/kfrlib"
    - icon: fontawesome/brands/x-twitter
      link: "https://x.com/kfrlib"

copyright: "Copyright &copy; 2016 - 2026 KFR"

validation:
  links:
    absolute_links: relative_to_docs

plugins:
  - search
  - privacy:
      assets_exclude:
        - cdn.jsdelivr.net/*
  - gh-admonitions
  - redirects:
      redirect_maps:
        'basics.md': 'getting-started/basics.md'
        'benchmarking.md': 'advanced/benchmarking.md'
        'bq.md': 'dsp/bq.md'
        'bq_gallery.md': 'dsp/examples/bq_gallery.md'
        'capi.md': 'advanced/capi.md'
        'clang.md': 'getting-started/clang.md'
        'conv_reverb.md': 'dft/conv_reverb.md'
        'conversion.md': 'dsp/misc.md#audio-sample-conversion'
        'convert_stereo.md': 'dsp/misc.md#stereo-mixing-and-midside-conversion'
        'convolution.md': 'dft/convolution.md'
        'dft.md': 'dft/dft.md'
        'dft2.md': 'dft/dft_introduction.md'
        'dft_format.md': 'dft/dft_layout.md'
        'dft/dft_format.md': 'dft/dft_layout.md'
        'dsp_glossary.md': 'advanced/dsp_glossary.md'
        'ebur128.md': 'dsp/ebur128.md'
        'expressions.md': 'expressions/expressions.md'
        'file_support.md': 'audio_io/file_support.md'
        'fir.md': 'dsp/fir.md'
        'fir_gallery.md': 'dsp/examples/fir_gallery.md'
        'handle.md': 'expressions/handle.md'
        'iir.md': 'dsp/iir.md'
        'iir_gallery.md': 'dsp/examples/iir_gallery.md'
        'installation.md': 'getting-started/installation.md'
        'introduction.md': 'index.md'
        'kb.md': 'advanced/kb.md'
        'normalize.md': 'dsp/misc.md#peak-normalization'
        'plot.md': 'audio_io/plot.md'
        'read_audio.md': 'audio_io/read_audio.md'
        'src.md': 'dsp/src.md'
        'src_gallery.md': 'dsp/examples/src_gallery.md'
        'upgrade5.md': 'getting-started/upgrade5.md'
        'upgrade6.md': 'getting-started/upgrade6.md'
        'upgrade7.md': 'getting-started/upgrade7.md'
        'whatsnew5.md': 'getting-started/whatsnew5.md'
        'whatsnew6.md': 'getting-started/whatsnew6.md'
        'whatsnew7.md': 'getting-started/whatsnew7.md'
        'window_gallery.md': 'dsp/examples/window_gallery.md'
        'without_cmake.md': 'getting-started/without_cmake.md'
  - cxxdox:
      title: KFR API Reference
      path_prefix: _gen/
      default_namespace: kfr
      render_snippet_markers: true
      git_browse: https://github.com/kfrlib/kfr/blob/{SHA}/include/kfr/{FILE_PATH}#L{LINE}
      input:
        - include:
            - ../include/kfr/all.hpp # relative to mkdocs.yml
          exclude:
            - ../include/kfr/thirparty
            - "*/impl/*"
          exclude_symbols:
            - "*::intr::*"
            - "*::internal::*"
            - "*::details::*"
            - "*::fn::*"
            - "*::internal_generic::*"
            - "tl::*"
            - "TL_*"
            - "KFR_GEN_LIST*"
          hide_tokens:
            - KFR_INLINE
            - KFR_INTRINSIC
            - KFR_MEM_INTRINSIC
            - KFR_FUNCTION
            - KFR_INTRINSIC
            - KFR_MEM_INTRINSIC
            - KFR_UNUSED
            - KFR_INLINE
            - KFR_API_SPEC
          compile_options:
            - -std=c++20
            - "-DDOCUMENTATION"
            - "-DKFR_FORCE_GENERIC_CPU=1"
            - "-DKFR_HAVE_ELLIPTIC=1"
            - "-DKFR_AUDIO_FLAC=1"
            - "-I../include"
          inline_namespaces:
            - kfr::generic
        - include:
            - ../include/kfr/capi.h # relative to mkdocs.yml
          hide_tokens:
            - KFR_INLINE
            - KFR_INTRINSIC
            - KFR_MEM_INTRINSIC
            - KFR_FUNCTION
            - KFR_INTRINSIC
            - KFR_MEM_INTRINSIC
            - KFR_UNUSED
            - KFR_INLINE
            - KFR_API_SPEC
          compile_options:
            - -std=c99
            - "-DDOCUMENTATION"
            - "-I../include"
      groups:
        - id: common
          title: Common Headers
          description: "Global configuration, versioning, and core library headers."
          file:
            - config.h
            - cident.h
            - kfr.h
            - multiarch.h
            - version.hpp
            - except.hpp
            - all.hpp
        - id: meta
          title: Metaprogramming
          description: "Template metaprogramming utilities and C++ type traits."
          file:
            - meta
            - meta.hpp
        - id: simd
          title: SIMD Acceleration
          description: "Cross-platform SIMD vector operations and hardware acceleration."
          file:
            - simd
            - simd.hpp
        - id: math
          title: Mathematical Functions
          description: "High-performance mathematical operations and transcendental functions."
          file:
            - math
            - math.hpp
        - id: base
          title: Base Utilities
          description: "Core data structures and fundamental utilities for KFR."
          file:
            - base
            - base.hpp
        - id: dsp
          title: Digital Signal Processing
          description: "Comprehensive DSP algorithms including filters, oscillators, and signal analysis tools."
          file:
            - dsp
            - dsp.hpp
        - id: dft
          title: Discrete Fourier Transform
          description: "High-performance FFT, convolution, and spectral analysis routines."
          file:
            - dft
            - dft.hpp
        - id: capi
          title: C API
          description: "C-compatible interface for accessing KFR functionality."
          file:
            - capi.h
        - id: io
          title: Input/Output
          description: "File I/O, audio format support, and data visualization tools."
          file:
            - io
            - io.hpp
        - id: audio
          title: Audio Processing
          description: "Audio-specific processing, codecs, and format handling."
          file:
            - audio
            - audio.hpp
        - id: runtime
          title: Runtime Environment
          description: "Runtime CPU detection and environment configuration."
          file:
            - runtime
            - runtime.hpp
        - id: test
          title: Testing Utilities
          description: "Unit testing framework and test utilities for KFR."
          file:
            - test
  - minify:
      minify_html: true
      htmlmin_opts:
          remove_comments: true

markdown_extensions:
  - admonition
  - footnotes
  - meta
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.details
  - pymdownx.magiclink
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html

extra_javascript:
  - js/math.js
  - https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.js

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.css
  - css/fix.css

repo_url: https://github.com/kfrlib/kfr
repo_name: KFR
edit_uri: edit/main/docs/

