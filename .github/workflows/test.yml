name: Test
on: push
jobs:
  windows2025-msvc2026-x86:
    runs-on: windows-2025-vs2026
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Tests
      env:
        SDE_WINDOWS2: ${{ secrets.SDE_WINDOWS2 }}
        TMP_DIR: ${{ runner.temp }}
      shell: cmd
      run: |
        choco install ninja --no-progress -y
        curl -o "%TMP_DIR%\sde.tar.xz" -L %SDE_WINDOWS2%
        mkdir C:\sde
        tar -C C:\sde -xf "%TMP_DIR%\sde.tar.xz" --strip-components=1
        call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsamd64_x86.bat"
        set PATH=C:\sde;%PATH%
        ci\run.cmd build-release -DKFR_ARCH_TESTS=sse2,ssse3,sse42,avx,avx2 -DKFR_ENABLE_MULTIARCH=ON -DKFR_USE_SDE=ON -DKFR_ARCH=sse2 -DCMAKE_BUILD_TYPE=Release

  windows2025-msvc2026-x86_64:
    runs-on: windows-2025-vs2026
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Tests
      env:
        SDE_WINDOWS2: ${{ secrets.SDE_WINDOWS2 }}
        TMP_DIR: ${{ runner.temp }}
      shell: cmd
      run: |
        choco install ninja --no-progress -y
        curl -o "%TMP_DIR%\sde.tar.xz" -L %SDE_WINDOWS2%
        mkdir C:\sde
        tar -C C:\sde -xf "%TMP_DIR%\sde.tar.xz" --strip-components=1
        call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        set PATH=C:\sde;%PATH%
        ci\run.cmd build-release -DKFR_ARCH_TESTS=sse2,ssse3,sse42,avx,avx2,avx512 -DKFR_ENABLE_MULTIARCH=ON -DKFR_USE_SDE=ON -DKFR_ARCH=sse2 -DCMAKE_BUILD_TYPE=Release

  windows2022-msvc2022-x86_64:
    runs-on: windows-2022
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Tests
      shell: cmd
      run: |
        choco install ninja --no-progress -y
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        ci\run.cmd build-release -DCMAKE_BUILD_TYPE=Release
